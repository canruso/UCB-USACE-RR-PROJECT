#   - "01/10/2000-30/09/2001" #2001
#   - "01/10/2006-30/09/2007" #2007
#   - "01/10/2008-30/09/2009" #2009

# You can also override the device in code if desired; defaulting to CPU or GPU here
device: cuda:0

physics_informed: false
physics_data_file: null

# --- Validation Configuration ----------------------------------------------
# validate_every: 12  # Max PR#9
validate_every: 3
validate_n_random_basins: 1
save_validation_results: true
save_results_every: 10

metrics:
  - NSE
  - MSE

# --- Model Configuration: MTS-LSTM ------------------------------------------
model: mtslstm
shared_mtslstm: false
transfer_mtslstm_states:
  h: linear
  c: linear

use_frequencies:
  - 1H
  - 1D

head: regression
output_activation: linear

hidden_size: 64
initial_forget_bias: 3
output_dropout: 0.5

# --- Training Configuration -------------------------------------------------
optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-2

batch_size: 64
epochs: 300
clip_gradient_norm: 1

predict_last_n:
  1D: 1
  1H: 24

seq_length:
  1D: 90
  1H: 336

log_interval: 16
log_tensorboard: true
log_n_figures: 0
save_weights_every: 16

# --- Data Configuration -----------------------------------------------------
# dataset: synthetic_russian_river  # Max PR#9 - for extreme year runs
dataset: russian_river
data_dir: "F:/Dino/UCB-USACE-LSTMs/data/updated_russian_river_folder/"
