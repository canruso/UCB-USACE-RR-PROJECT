# --- Experiment configurations --------------------------------------------------------------------

# experiment name, used as folder name
experiment_name: testing_run

# files to specify training, validation and test basins (relative to code root or absolute path)
train_basin_file: calpella
validation_basin_file: calpella
test_basin_file: calpella

# training, validation and test time periods (format = 'dd/mm/yyyy')
train_start_date: "01/10/1994"
train_end_date: "30/09/2002" 
validation_start_date: "01/10/2002"
validation_end_date: "30/09/2005"
test_start_date: "01/10/2005"
test_end_date: "29/09/2009"


# which GPU (id) to use [in format of cuda:0, cuda:1 etc, or cpu or None]
device: cuda:0
physics_informed: false
physics_data_file: null

# --- Validation configuration ---------------------------------------------------------------------

# specify after how many epochs to perform validation
validate_every: 3

# specify how many random basins to use for validation
validate_n_random_basins: 1

# specify which metrics to calculate during validation (see neuralhydrology.evaluation.metrics)
# this can either be a list or a dictionary. If a dictionary is used, the inner keys must match the name of the
# target_variable specified below. Using dicts allows for different metrics per target variable.
metrics:
  - NSE
  - MSE

# --- Model configuration --------------------------------------------------------------------------

# base model type [lstm, ealstm, cudalstm, embcudalstm, mtslstm]
# (has to match the if statement in modelzoo/__init__.py)
model: cudalstm

# prediction head [regression]. Define the head specific parameters below
head: regression

# ----> Regression settings <----
output_activation: linear

# ----> General settings <----

# Number of cell states of the LSTM
hidden_size: 64

# Initial bias value of the forget gate
initial_forget_bias: 3

# Dropout applied to the output of the LSTM
output_dropout: 0.5

#number of LSTM layers
num_layers: 1
dev_mode: True

# --- Training configuration -----------------------------------------------------------------------

# specify optimizer [Adam]
optimizer: Adam

# specify loss [MSE, NSE, RMSE]
loss: NSE

# specify learning rates to use starting at specific epochs (0 is the initial learning rate)
learning_rate:
  0: 1e-2
  20: 5e-3
  30: 1e-3

# Mini-batch size
batch_size: 256

# Number of training epochs
epochs: 300

# If a value, clips the gradients during training to that norm.
clip_gradient_norm: 1

# Defines which time steps are used to calculate the loss. Can't be larger than seq_length.
# If use_frequencies is used, this needs to be a dict mapping each frequency to a predict_last_n-value, else an int.
predict_last_n: 1

# Length of the input sequence
# If use_frequencies is used, this needs to be a dict mapping each frequency to a seq_length, else an int.
seq_length: 365

# Number of parallel workers used in the data pipeline
# num_workers: 8

# Log the training loss every n steps
log_interval: 16

# If true, writes logging results into tensorboard file
log_tensorboard: True

# If a value and greater than 0, logs n random basins as figures during validation
log_n_figures: 1

# Save model weights every n epochs
save_weights_every: 16


# --- Early Stopping Configuration ------------------------------------------------------------
# Enable early stopping based on validation performance
early_stopping: True

# Early stopping mode: "patience", "slope", "plateau", or "none"
# - "patience": Traditional approach (stops after N validations without improvement)
# - "slope": Trend-based approach (stops when loss trend shows no improvement)
# - "plateau": Coupled LR scheduler + ES (ReduceLROnPlateau, stops when min_lr reached + no improvement)
# - "none": Disables early stopping
early_stopping_mode: "plateau"

# --- Plateau Mode Settings ---
plateau_factor: 0.5
plateau_patience: 3
plateau_threshold: 1.0e-4
plateau_min_lr: 1.0e-5
plateau_final_patience: 3
plateau_cooldown: 0
plateau_min_epoch: 24

# --- Previous patience/slope settings (commented out) ---
# early_stopping_mode: "patience"
# patience_early_stopping: 5
# min_delta_early_stopping: 0.0
# minimum_epochs_before_early_stopping: 16
# early_stopping_slope_window: 7
# early_stopping_slope_patience: 2
# early_stopping_slope_min_epoch: 8
# early_stopping_slope_ema_alpha: 0.4
# early_stopping_slope_use_log: True
# early_stopping_slope_log_eps: 1.0e-12
# early_stopping_slope_eps_slope: 1.0e-3
# early_stopping_slope_min_window_gain: 0.01
# early_stopping_slope_variance_guard: True
# early_stopping_slope_variance_cv_max: 0.01

# =============================================================================
# EARLY STOPPING CONFIGURATION VARIANTS
# =============================================================================
# Uncomment ONE of the following blocks to enable a specific early stopping strategy.
# The current settings above have early_stopping: False (disabled).
#
# -----------------------------------------------------------------------------
# VARIANT A: Patience-based AGGRESSIVE (stops quickly if no improvement)
# Good for: Quick experiments, hyperparameter search, when training is expensive
# -----------------------------------------------------------------------------
# early_stopping: True
# early_stopping_mode: "patience"
# patience_early_stopping: 2           # Stop after 2 validations without improvement
# min_delta_early_stopping: 0.001      # Require 0.1% improvement to count
# minimum_epochs_before_early_stopping: 10
#
# -----------------------------------------------------------------------------
# VARIANT B: Patience-based CONSERVATIVE (allows more exploration)
# Good for: Final training runs, when you want thorough training
# -----------------------------------------------------------------------------
# early_stopping: True
# early_stopping_mode: "patience"
# patience_early_stopping: 5           # Stop after 5 validations without improvement
# min_delta_early_stopping: 0.0        # Any improvement counts
# minimum_epochs_before_early_stopping: 15
#
# -----------------------------------------------------------------------------
# VARIANT C: Slope-based (trend analysis, robust to noise)
# Good for: Noisy loss curves, when you want statistically sound stopping
# -----------------------------------------------------------------------------
# early_stopping: True
# early_stopping_mode: "slope"
# early_stopping_slope_window: 7       # 7-epoch rolling window
# early_stopping_slope_patience: 2     # 2 consecutive flat checks
# early_stopping_slope_min_epoch: 10   # Don't check before epoch 10
# early_stopping_slope_ema_alpha: 0.4  # Smoothing factor
# early_stopping_slope_eps_slope: 1.0e-3        # ~0.1% improvement/epoch threshold
# early_stopping_slope_min_window_gain: 0.01    # ~1% total window improvement
# early_stopping_slope_variance_guard: True     # Ignore jittery windows
# early_stopping_slope_variance_cv_max: 0.02    # 2% CV threshold for stability
#
# =============================================================================

# --- Data configurations --------------------------------------------------------------------------

# which data set to use [camels_us, camels_gb, global, hourly_camels_us]
dataset: russian_river

# Path to data set root
data_dir: "F:/Dino/UCB-USACE-LSTMs/data/11082024_data_streamflow_met_Russian_River_share_UCB"

# Forcing product [daymet, maurer, maurer_extended, nldas, nldas_extended, nldas_hourly]
# can be either a list of forcings or a single forcing product
# forcings:
#   - maurer
#   - daymet
#   - nldas

dynamic_inputs:
  #subbasin preceip and ET
  - EF RUSSIAN 20 ET-POTENTIAL RUN:BASIN AVERAGE 60 YR
  - EF RUSSIAN 20 PRECIP-INC SCREENED
  #boundary conditions
  # - POTTER VALLEY CA FLOW USGS_ADJUSTED  # BC removed for NOBC ablation
  #met gages
  - UKIAH CA HUMIDITY USAF-NOAA
  - UKIAH CA SOLAR RADIATION USAF-NOAA
  - UKIAH CA TEMPERATURE USAF-NOAA
  - UKIAH CA WINDSPEED USAF-NOAA
  
# which columns to use as target
target_variables:
  - NR CALPELLA FLOW COE CPL

# clip negative predictions to zero for all variables listed below. Should be a list, even for single variables.
clip_targets_to_zero:
  - [NR CALPELLA FLOW COE CPL]
