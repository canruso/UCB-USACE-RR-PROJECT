# Experiment name 
experiment_name: testing_run

data_dir: /global/home/users/ananyadua/USACE-UCB-LSTM/russian_river_data
dataset: russian_river

# File paths for train/validation/test basins
#specify train/validation/test basins
train_basin_file: /global/home/users/ananyadua/USACE-UCB-LSTM/neuralhydrology/savio_training/calpella
validation_basin_file: /global/home/users/ananyadua/USACE-UCB-LSTM/neuralhydrology/savio_training/calpella
test_basin_file: /global/home/users/ananyadua/USACE-UCB-LSTM/neuralhydrology/savio_training/calpella

# Training, validation, and test time ranges (format: dd/mm/yyyy)
train_start_date: "01/10/1994"
train_end_date: "30/09/2002"
validation_start_date: "01/10/2002"
validation_end_date: "30/09/2005"
test_start_date: "01/10/2005"
test_end_date: "30/09/2009"

# Hardware setup
device: cpu        # options: cpu, cuda:0, cuda:1, etc.

# Validation configuration
validate_every: 5       # validate every N epochs
validate_n_random_basins: 1
save_validation_results: True

metrics:
  - NSE
  - MSE         

# Model configuration
model: mtslstm
shared_mtslstm: false
transfer_mtslstm_states:
  h: linear
  c: linear

use_frequencies:
  - 1H
  - 1D

head: regression
output_activation: linear

# LSTM cell size, dropout, etc.
hidden_size: 64
initial_forget_bias: 3
output_dropout: 0.5

optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-2
  30: 5e-3
  40: 1e-3

batch_size: 64
epochs: 32
clip_gradient_norm: 1


predict_last_n:
  1D: 1
  1H: 24

seq_length:
  1D: 90
  1H: 336

log_interval: 16
log_tensorboard: True
log_n_figures: 1
save_weights_every: 16

physics_informed: false
physics_data_file: null
dev_mode: True

dynamic_inputs:
  1D:
    - EF RUSSIAN 20 ET-POTENTIAL RUN:BASIN AVERAGE 60 YR
    - EF RUSSIAN 20 PRECIP-INC SCREENED
    - POTTER VALLEY CA FLOW USGS_ADJUSTED
    - UKIAH CA HUMIDITY USAF-NOAA
    - UKIAH CA SOLAR RADIATION USAF-NOAA
    - UKIAH CA TEMPERATURE USAF-NOAA
    - UKIAH CA WINDSPEED USAF-NOAA
  1H:
    - EF RUSSIAN 20 ET-POTENTIAL RUN:BASIN AVERAGE 60 YR
    - EF RUSSIAN 20 PRECIP-INC SCREENED
    - POTTER VALLEY CA FLOW USGS_ADJUSTED
    - UKIAH CA HUMIDITY USAF-NOAA
    - UKIAH CA SOLAR RADIATION USAF-NOAA
    - UKIAH CA TEMPERATURE USAF-NOAA
    - UKIAH CA WINDSPEED USAF-NOAA

target_variables:
  - NR CALPELLA FLOW COE CPL

clip_targets_to_zero:
  - [NR CALPELLA FLOW COE CPL]